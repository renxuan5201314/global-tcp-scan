
name: Global YouTube HTTPS latency scan (official CloudflareSpeedTest)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-tcp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official CloudflareSpeedTest Linux x86-64 release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest",
              headers={"User-Agent": "global-tcp-scan"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)

          assets = release.get("assets", [])
          matches = [
              asset for asset in assets
              if "linux" in asset["name"].lower()
              and (
                  "amd64" in asset["name"].lower()
                  or "x86_64" in asset["name"].lower()
              )
              and asset["name"].lower().endswith(
                  (".tar.gz", ".tgz", ".zip")
              )
          ]
          if not matches:
              raise SystemExit(
                  "No Linux x86-64 archive found. Assets: "
                  + ", ".join(asset["name"] for asset in assets)
              )
          print(matches[0]["browser_download_url"])
          PY
          url="$(python - <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/XIU2/CloudflareSpeedTest/releases/latest",
              headers={"User-Agent": "global-tcp-scan"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              release = json.load(response)

          assets = release.get("assets", [])
          matches = [
              asset for asset in assets
              if "linux" in asset["name"].lower()
              and (
                  "amd64" in asset["name"].lower()
                  or "x86_64" in asset["name"].lower()
              )
              and asset["name"].lower().endswith(
                  (".tar.gz", ".tgz", ".zip")
              )
          ]
          if not matches:
              raise SystemExit("No Linux x86-64 release archive found")
          print(matches[0]["browser_download_url"])
          PY
          )"
          echo "Downloading $url"
          curl --fail --location --retry 3 "$url" -o /tmp/cfst-release
          mkdir -p /tmp/cfst-unpack
          if file /tmp/cfst-release | grep -qi 'gzip compressed'; then
            tar -xzf /tmp/cfst-release -C /tmp/cfst-unpack
          elif file /tmp/cfst-release | grep -qi 'Zip archive'; then
            unzip -q /tmp/cfst-release -d /tmp/cfst-unpack
          else
            echo "Unknown CFST archive format"
            file /tmp/cfst-release
            exit 1
          fi
          binary="$(find /tmp/cfst-unpack -type f \( -name cfst -o -name CloudflareSpeedTest \) -print -quit)"
          test -n "$binary" || {
            echo "Could not find CFST executable"
            find /tmp/cfst-unpack -maxdepth 3 -type f
            exit 1
          }
          install -m 0755 "$binary" ./cfst
          ./cfst -v || true

      - name: Run all-region HTTPS scan
        id: scan
        env:
          SOURCE_URL: https://proxy.seeck.cn/api/nodes?region=
          REGIONS: JP,HK,KR,CN,US,SG,DE
          TOP_N: "20"
          PUBLISH_STANDARD_VARIANTS: "true"
          CFST_BIN: ./cfst
          CFST_THREADS: "20"
          CFST_ROUNDS: "4"
          CFST_TIMEOUT_SECONDS: "3"
          CFST_URL: https://www.youtube.com/generate_204
          CFST_HTTPING_CODE: "204"
        run: python scanner.py

      - name: Commit updated public results and state
        if: steps.scan.outputs.publish == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public .scan-state.json
          if git diff --cached --quiet; then
            echo "No published file changes."
          else
            git commit -m "Update YouTube HTTPS latency regional rankings"
            git push
          fi
