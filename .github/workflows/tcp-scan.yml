name: Cloudflare edge IP latency ranking

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: global-tcp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download CloudflareSpeedTest
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.3.5/cfst_linux_amd64.tar.gz -o /tmp/cfst.tar.gz
          tar -xzf /tmp/cfst.tar.gz -C "$GITHUB_WORKSPACE"
          chmod +x "$GITHUB_WORKSPACE/cfst"
          "$GITHUB_WORKSPACE/cfst" -v
      - name: Scan all regions
        run: python scanner.py
      - name: Commit only seven region files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jp.txt public/hk.txt public/kr.txt public/cn.txt public/us.txt public/sg.txt public/de.txt
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update regional Cloudflare latency rankings"
            git push
          fi
