```yaml
      - name: Download CloudflareSpeedTest
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.3.5/cfst_linux_amd64.tar.gz"
          ARCHIVE="/tmp/cfst.tar.gz"
          EXTRACT_DIR="/tmp/cfst-extract"

          mkdir -p "$EXTRACT_DIR"

          curl -fL --retry 3 "$URL" -o "$ARCHIVE"

          echo "=== Archive contents ==="
          tar -tzf "$ARCHIVE"

          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR"

          echo "=== Extracted files ==="
          find "$EXTRACT_DIR" -maxdepth 3 -type f -print

          # 自动查找解压出来的 Linux 可执行程序
          BIN="$(find "$EXTRACT_DIR" -maxdepth 3 -type f \
            \( -name 'cfst' -o -name 'CloudflareST' -o -name 'CloudflareSpeedTest' \) \
            -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::找不到 CloudflareSpeedTest 可执行文件，请检查上面的压缩包内容。"
            exit 1
          fi

          chmod +x "$BIN"
          cp "$BIN" "$GITHUB_WORKSPACE/cfst"
          chmod +x "$GITHUB_WORKSPACE/cfst"

          echo "=== Verify executable ==="
          "$GITHUB_WORKSPACE/cfst" -v
