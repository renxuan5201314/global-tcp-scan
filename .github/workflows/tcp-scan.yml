name: TCP Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: tcp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Download and locate CloudflareSpeedTest
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.3.5/cfst_linux_amd64.tar.gz"
          ARCHIVE="/tmp/cfst.tar.gz"
          EXTRACT_DIR="/tmp/cfst-extract"

          mkdir -p "$EXTRACT_DIR"
          curl -fL --retry 3 --connect-timeout 20 "$URL" -o "$ARCHIVE"

          echo "===== Archive contents ====="
          tar -tzf "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR"

          echo "===== Extracted files ====="
          find "$EXTRACT_DIR" -maxdepth 4 -type f -print

          BIN="$(find "$EXTRACT_DIR" -type f \
            \( -name 'cfst' -o -name 'CloudflareST' -o -name 'CloudflareSpeedTest' \) \
            -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::未在压缩包中找到 CFST 可执行文件。"
            exit 1
          fi

          install -m 755 "$BIN" "$GITHUB_WORKSPACE/cfst"

          file "$GITHUB_WORKSPACE/cfst"
          "$GITHUB_WORKSPACE/cfst" -v || true

      - name: Run regional scans
        shell: bash
        run: |
          set -euo pipefail
          python scanner.py

      - name: Keep only seven regional TXT files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p public

          # 只允许这七个地区文件存在于 public/
          for region in jp hk kr cn us sg de; do
            if [ ! -s "public/${region}.txt" ]; then
              echo "::error::public/${region}.txt 不存在或为空，停止清理和提交。"
              exit 1
            fi
          done

          # 删除 public/ 下所有其他文件和目录。
          find public -mindepth 1 -maxdepth 1 \
            ! -name 'jp.txt' \
            ! -name 'hk.txt' \
            ! -name 'kr.txt' \
            ! -name 'cn.txt' \
            ! -name 'us.txt' \
            ! -name 'sg.txt' \
            ! -name 'de.txt' \
            -exec rm -rf -- {} +

          echo "===== Final public directory ====="
          find public -mindepth 1 -maxdepth 1 -printf '%f\n' | sort

          COUNT="$(find public -mindepth 1 -maxdepth 1 -type f -name '*.txt' | wc -l)"
          if [ "$COUNT" -ne 7 ]; then
            echo "::error::public/ 最终 TXT 文件数量不是 7。"
            exit 1
          fi

      - name: Commit regional results
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 同时暂存七个结果文件和旧文件的删除记录。
          git add -A -- public/

          if git diff --cached --quiet; then
            echo "没有文件变化，无需提交。"
            exit 0
          fi

          git commit -m "Update regional TCP scan results"
          git push
